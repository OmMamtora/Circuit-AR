<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080907">
    <title>Circuit AR</title>
    <link rel="stylesheet" href="css/ar.css">
    
    <!-- Only include the A-Frame and MindAR scripts -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body, html, main { background: #080907 !important; color: #f4f4f2; }
    </style>
</head>
<body>
    <div class="ambient-grid" aria-hidden="true"></div>
    <main>
        <!-- ACTIVATE SCREEN -->
        <section class="ar-activate" id="ar-activate">
            <div class="ar-badge-preview">
                <img src="assets/circuit-ar-badge.png" alt="Circuit AR Badge">
            </div>
            <p class="section-kicker">Activate AR ⚡</p>
            <h1>Circuit AR<br><span>Experience</span></h1>
            <p class="ar-copy">Point your camera at the coaster to see the magic instantly.</p>
            <ol class="ar-steps">
                <li><span>1.</span> Tap "Activate Circuit AR" and allow camera access.</li>
                <li><span>2.</span> Point your phone at the AR Marker on any coaster.</li>
                <li><span>3.</span> The profile video opens automatically.</li>
            </ol>
            <button class="button button-primary pulse" type="button" id="ar-activate-btn">Activate Circuit AR ⚡</button>
            <p class="ar-status" id="ar-status" aria-live="polite"></p>
        </section>
        <!-- LIVE CAMERA STAGE -->
        <div class="ar-stage" id="ar-stage" hidden>
            <button type="button" class="ar-back-btn" id="ar-back-btn" style="position: absolute; z-index: 999;">← Cancel</button>
        </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/ar.js" defer></script>
</body>
</html>

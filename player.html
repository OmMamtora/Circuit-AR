<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080907">
    <title>Circuit AR — Member Video</title>

    <link rel="stylesheet" href="css/ar.css">
    <script src="js/data.js"></script>
</head>
<body>
    <div class="ambient-grid" aria-hidden="true"></div>

    <a href="index.html" class="ar-back-btn">← Scan again</a>

    <main class="player-page" id="player-page">
        <div class="player-video-wrap">
            <video
                id="memberVideo"
                class="player-video"
                controls
                autoplay
                playsinline
                preload="auto">
            </video>
            <button type="button" class="player-unmute-btn" id="unmuteBtn" hidden>🔇 Tap for sound</button>
        </div>

        <p class="section-kicker" id="player-kicker">Circuit AR ⚡</p>
        <h1 id="player-name">Member</h1>
        <p class="ar-copy" id="player-intro"></p>

        <a id="visitBtn" class="button button-primary pulse" target="_blank" rel="noopener">
            Visit Microsite →
        </a>
    </main>

    <!-- Shown if the scanned id doesn't match anyone on the team -->
    <section class="fallback-page" id="player-not-found" hidden>
        <div class="fallback-icon">?</div>
        <p class="section-kicker">Member Not Found</p>
        <h1>We couldn't match<br><span>that coaster.</span></h1>
        <p>The QR code didn't point to a known Circuit member. Try scanning again.</p>
        <a href="index.html" class="button button-primary">← Scan Again</a>
    </section>

    <script src="js/player.js" defer></script>
</body>
</html>
